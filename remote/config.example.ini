; Fragment config.ini dla stanowiska eventowego (Hitster karaoke).
; config.ini na macOS: ~/Library/Application Support/UltraStar Deluxe/config.ini
; Dopisz/zmień tylko poniższe sekcje i klucze; resztę pliku zostaw.

[Remote]
; 1 = pilot włączony, 0 = gra działa dokładnie jak upstream
Enabled=1
; port UDP, nasłuch tylko na 127.0.0.1
Port=47700
; 0 = po piosence ekran wyników (domyślnie), 1 = od razu powrót do ekranu oczekiwania
SkipScore=0
; po ilu sekundach ekran wyników sam wraca do ekranu oczekiwania (0 = czeka na klawisz)
ScoreSeconds=15
; liczba graczy (1, 2, 3, 4 lub 6); zapisywana też do [Game] Players
Players=2
; napis na ekranie oczekiwania (puste = brak napisu)
WaitingText=Scan your card
WaitingSubText=and sing the duel
; 1 = ekrany Hitster (oczekiwanie, pasek pojedynku, wyniki) z UHitsterUI, 0 = zwykłe USDX
Design=1
; głośność zajawki piosenki na ekranie wyników, 0-100
TeaserVolume=70
; katalog grafik z hitster/install.py (puste = <katalog użytkownika>/hitster)
ArtDir=

[Game]
; lista piosenek bez zakładek kategorii
Tabs=Off
Language=English

[Advanced]
; bez przejść między ekranami (inaczej widać na chwilę zwykłe menu USDX)
ScreenFade=Off
; wyniki rysuje pasek pojedynku, nie ramki USDX
SingScores=Off

[Sound]
; muzyka tylko podczas śpiewania i na ekranie wyników:
; bez podglądu piosenki na liście i bez muzyki w tle w menu
PreviewVolume=0
BackgroundMusic=Off

; Mikrofony Behringer FLOW 8 (kanał 1 -> gracz 1, kanał 2 -> gracz 2).
; Najprościej ustawić raz w grze: Opcje -> Nagrywanie, gra zapisze wtedy
; sekcję [Record] w postaci:
;
; [Record]
; DeviceName[1]=<nazwa urządzenia FLOW 8 z PortAudio>
; Input[1]=0
; Channel1[1]=1
; Channel2[1]=2
